<!doctype html>
<html lang="ko">
<!-- 배경 사진은 파일 안에 포함돼 있어요 -->
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>나 홀로 스탑워치</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,500;1,500;1,700&family=Gowun+Batang:wght@700&display=swap" rel="stylesheet">
<style>
  :root {
    --night: #050507;
    --gold: #ffd98a;
    --red: #a3202a;
    --green: #1f4a36;
    --cream: #f6ecd8;
    --muted: #a8997f;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    min-height: 100vh;
    overflow-x: hidden;
    background: var(--night);
    color: var(--cream);
    font-family: "Gowun Batang", -apple-system, "Apple SD Gothic Neo", serif;
    display: flex;
    flex-direction: column;
    align-items: center;
    padding: 0 0 40px;
  }

  /* 사진 장면: 모든 오버레이는 % 좌표라서 사진 크기가 변해도 제자리에 붙어 있음 */
  .scene {
    position: relative;
    width: 100%;
    max-width: 1100px;
    aspect-ratio: 720 / 404;
    overflow: hidden;
    background: #000;
  }
  .scene img.photo {
    position: absolute;
    inset: 0;
    width: 100%;
    height: 100%;
    display: block;
    filter: contrast(1.04) saturate(1.05);
  }
  .scene::after { /* 가장자리 어둡게 */
    content: "";
    position: absolute;
    inset: 0;
    background: radial-gradient(ellipse at 50% 45%, transparent 55%, rgba(0, 0, 0, 0.55));
    pointer-events: none;
  }
  .scene .grain {
    position: absolute;
    inset: 0;
    z-index: 4;
    opacity: 0.09;
    mix-blend-mode: overlay;
    pointer-events: none;
    background-image: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='200' height='200'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='2' stitchTiles='stitch'/></filter><rect width='200' height='200' filter='url(%23n)'/></svg>");
    animation: grain 0.5s steps(2) infinite;
  }
  @keyframes grain { 50% { background-position: 60px 40px; } }

  .snow { position: absolute; inset: 0; z-index: 3; pointer-events: none; overflow: hidden; }
  .flake {
    position: absolute;
    top: -10px;
    border-radius: 50%;
    background: #fff;
    filter: blur(0.6px);
    animation: fall linear infinite;
  }
  @keyframes fall { to { transform: translate(var(--drift), 480px); } }

  /* 별 반짝임: 사진 속 트리 꼭대기 별 위치(49.3%, 15.4%) */
  .star-fx {
    position: absolute;
    left: 49.3%;
    top: 15.4%;
    width: 0;
    height: 0;
    z-index: 2;
    mix-blend-mode: screen;
    pointer-events: none;
  }
  .star-fx .halo {
    position: absolute;
    width: 14vw; height: 14vw;
    max-width: 150px; max-height: 150px;
    left: -7vw; top: -7vw;
    margin-left: max(-75px, 0px);
    border-radius: 50%;
    background: radial-gradient(circle, rgba(255, 252, 235, 1) 0%, rgba(255, 220, 150, 0.55) 25%, rgba(255, 190, 90, 0) 65%);
    transform: scale(0.35);
    opacity: 0.55;
  }
  .star-fx .ray {
    position: absolute;
    left: -9vw; top: -0.1vw;
    width: 18vw; height: 0.25vw;
    background: linear-gradient(90deg, transparent, rgba(255, 250, 235, 0.95), transparent);
    opacity: 0;
    transform: scaleX(0.2);
  }
  .star-fx .ray.b { transform: rotate(90deg) scaleX(0.2); }
  .star-fx .ray.c { transform: rotate(45deg) scaleX(0.2); }
  .star-fx .ray.d { transform: rotate(-45deg) scaleX(0.2); }
  .scene.sparkle .halo { animation: halo 1.5s ease-out; }
  .scene.sparkle .ray.a { animation: ray-a 1.5s ease-out; }
  .scene.sparkle .ray.b { animation: ray-b 1.5s ease-out; }
  .scene.sparkle .ray.c { animation: ray-c 1.5s ease-out; }
  .scene.sparkle .ray.d { animation: ray-d 1.5s ease-out; }
  @keyframes halo {
    0%   { transform: scale(0.35); opacity: 0.55; }
    25%  { transform: scale(1.5); opacity: 1; }
    100% { transform: scale(0.35); opacity: 0.55; }
  }
  @keyframes ray-a { 25% { opacity: 1; transform: scaleX(1.1); } 100% { opacity: 0; transform: scaleX(1.5); } }
  @keyframes ray-b { 25% { opacity: 1; transform: rotate(90deg) scaleX(1.1); } 100% { opacity: 0; transform: rotate(90deg) scaleX(1.5); } }
  @keyframes ray-c { 25% { opacity: 0.8; transform: rotate(45deg) scaleX(0.7); } 100% { opacity: 0; transform: rotate(45deg) scaleX(1); } }
  @keyframes ray-d { 25% { opacity: 0.8; transform: rotate(-45deg) scaleX(0.7); } 100% { opacity: 0; transform: rotate(-45deg) scaleX(1); } }

  /* 트리 전구 반짝이 */
  .twinkles { position: absolute; inset: 0; z-index: 2; mix-blend-mode: screen; pointer-events: none; }
  .tw {
    position: absolute;
    width: 0.9%;
    aspect-ratio: 1;
    border-radius: 50%;
    background: radial-gradient(circle, #fff6dc 0%, rgba(255, 190, 90, 0.7) 40%, transparent 70%);
    animation: tw var(--t) ease-in-out infinite;
    animation-delay: var(--d);
    opacity: 0;
  }
  @keyframes tw { 50% { opacity: 0.9; transform: scale(1.5); } }
  .scene.sparkle .twinkles { animation: boost 1.5s ease-out; }
  @keyframes boost { 30% { filter: brightness(2.2); } }

  /* 케빈(사진 속 뒷모습) 머리 위치(32%, 31%) */
  .kevin-head {
    position: absolute;
    left: 32%;
    top: 33%;
    width: 0; height: 0;
    z-index: 5;
  }
  .bubble {
    position: absolute;
    left: -2vw;
    bottom: 5.5vw;
    background: var(--cream);
    color: var(--red);
    font-family: "Playfair Display", serif;
    font-style: italic;
    font-weight: 700;
    font-size: clamp(13px, 2.7vw, 30px);
    padding: 0.4em 0.9em;
    border-radius: 1em;
    white-space: nowrap;
    box-shadow: 0 0 30px rgba(255, 170, 70, 0.55), 0 6px 16px rgba(0, 0, 0, 0.5);
    opacity: 0;
    transform: scale(0.6) translateY(10px);
    transform-origin: bottom left;
    transition: opacity 0.25s, transform 0.35s cubic-bezier(.3, 1.6, .5, 1);
    pointer-events: none;
  }
  .bubble::after {
    content: "";
    position: absolute;
    left: 28%;
    bottom: -10px;
    border: 10px solid transparent;
    border-top-color: var(--cream);
    border-bottom: 0;
  }
  .bubble.show { opacity: 1; transform: scale(1) translateY(0); }

  /* 웃는 케빈: 사진 위 머리 위로 떠오르는 😂 */
  .laugh {
    position: absolute;
    left: -2.2vw;
    top: -4vw;
    font-size: clamp(22px, 4.4vw, 48px);
    opacity: 0;
    pointer-events: none;
  }
  .laugh.go { animation: laugh 0.5s ease-in-out 6; }
  @keyframes laugh {
    0% { opacity: 0; transform: translateY(8px) scale(0.6) rotate(-10deg); }
    30% { opacity: 1; }
    50% { opacity: 1; transform: translateY(-6px) scale(1.15) rotate(10deg); }
    100% { opacity: 0; transform: translateY(-18px) scale(1) rotate(-6deg); }
  }

  /* 케빈 사진 조각: 1분마다 폴짝 */
  #kevinCut {
    position: absolute;
    z-index: 3;
    left: 17%;
    top: 22%;
    width: 31%;
    height: 78%;
    background-size: 322.6% 128.2%;
    background-position: 24.6% 100%;
    background-repeat: no-repeat;
    -webkit-mask-image: radial-gradient(ellipse 58% 62% at 50% 62%, #000 60%, transparent 100%);
    mask-image: radial-gradient(ellipse 58% 62% at 50% 62%, #000 60%, transparent 100%);
    pointer-events: none;
    opacity: 0;
  }
  #kevinCut.hop { opacity: 1; animation: hop 0.5s ease-in-out 6; }
  @keyframes hop { 50% { transform: translateY(-3.2%); } }

  header { text-align: center; padding: 18px 16px 0; }
  h1 {
    font-family: "Playfair Display", serif;
    font-style: italic;
    font-weight: 500;
    font-size: clamp(24px, 5vw, 40px);
    margin: 0;
    color: var(--gold);
    text-shadow: 0 0 22px rgba(255, 170, 70, 0.45);
  }
  .subtitle { margin: 6px 0 4px; font-size: 12px; letter-spacing: 7px; color: var(--muted); }

  /* 스탑워치 */
  .card {
    width: calc(100% - 32px);
    max-width: 440px;
    margin-top: 18px;
    padding: 22px 20px 12px;
    border-radius: 20px;
    background: linear-gradient(180deg, rgba(30, 22, 16, 0.9), rgba(12, 9, 7, 0.95));
    border: 1px solid rgba(255, 217, 138, 0.35);
    box-shadow: 0 0 50px rgba(255, 170, 70, 0.12), 0 20px 40px rgba(0, 0, 0, 0.6);
  }
  .display {
    text-align: center;
    font-family: -apple-system, "SF Pro Display", "Helvetica Neue", sans-serif;
    font-size: clamp(46px, 15vw, 68px);
    font-weight: 200;
    font-variant-numeric: tabular-nums;
    color: var(--gold);
    text-shadow: 0 0 18px rgba(255, 170, 70, 0.6);
    margin: 0 0 18px;
  }
  .controls { display: flex; gap: 12px; margin-bottom: 14px; }
  button {
    flex: 1;
    height: 54px;
    border-radius: 14px;
    border: 1px solid rgba(255, 217, 138, 0.45);
    font-family: inherit;
    font-size: 18px;
    cursor: pointer;
    color: var(--cream);
    transition: transform 0.08s, opacity 0.15s, filter 0.15s;
  }
  button:hover:not(:disabled) { filter: brightness(1.15); }
  button:active { transform: scale(0.97); }
  button:disabled { opacity: 0.4; cursor: default; }
  #lapBtn { background: rgba(255, 255, 255, 0.07); }
  #startBtn { background: var(--green); }
  #startBtn.running { background: var(--red); }

  ul { list-style: none; margin: 0; padding: 0; max-height: 220px; overflow-y: auto; }
  li {
    display: flex;
    justify-content: space-between;
    padding: 10px 4px;
    border-top: 1px solid rgba(255, 217, 138, 0.15);
    font-variant-numeric: tabular-nums;
  }
  li.best { color: #7ee0a1; }
  li.worst { color: #ff7a7a; }
  .hint { text-align: center; color: var(--muted); font-size: 12px; margin: 12px 0 0; }
</style>
</head>

  <header>
    <h1>Christmas in New York</h1>
    <p class="subtitle">나 홀로 스탑워치</p>
  </header>

  <div class="card">
    <div class="display" id="display">00:00.00</div>
    <div class="controls">
      <button id="lapBtn" disabled>랩</button>
      <button id="startBtn">시작</button>
    </div>
    <ul id="laps"></ul>
    <p class="hint">Space: 시작/정지 · L: 랩 · R: 재설정 · 10초마다 ⭐ · 1분마다 케빈</p>
  </div>

<script>
  const rand = (a, b) => a + Math.random() * (b - a);

  // 눈
  const snow = document.getElementById('snow');
  for (let i = 0; i < 70; i++) {
    const f = document.createElement('span');
    const size = rand(1.5, 5);
    f.className = 'flake';
    f.style.left = rand(0, 100) + '%';
    f.style.width = f.style.height = size + 'px';
    f.style.opacity = rand(0.3, 0.8);
    f.style.setProperty('--drift', rand(-40, 40) + 'px');
    f.style.animationDuration = rand(6, 14) + 's';
    f.style.animationDelay = -rand(0, 14) + 's';
    snow.appendChild(f);
  }

  // 트리 위에 흩뿌리는 반짝이 (사진 속 트리: x 39~62%, y 15~67%)
  const twinkles = document.getElementById('twinkles');
  for (let i = 0; i < 90; i++) {
    const yFrac = Math.sqrt(Math.random());
    const y = 17 + yFrac * 50;
    const half = 1.5 + yFrac * 10.5;
    const t = document.createElement('span');
    t.className = 'tw';
    t.style.left = (49.3 + rand(-half, half)) + '%';
    t.style.top = y + '%';
    t.style.setProperty('--t', rand(0.8, 2.4) + 's');
    t.style.setProperty('--d', -rand(0, 2.4) + 's');
    twinkles.appendChild(t);
  }

  // ===== 연출 트리거 =====
  const scene = document.getElementById('scene');
  const bubble = document.getElementById('bubble');
  const laugh = document.getElementById('laugh');
  const kevinCut = document.getElementById('kevinCut');
  let cheerTimer = null;

  function restart(node, cls) {
    node.classList.remove(cls);
    void node.offsetWidth; // 애니메이션 다시 시작
    node.classList.add(cls);
  }

  function sparkleStar() { restart(scene, 'sparkle'); }

  function kevinCheer() {
    clearTimeout(cheerTimer);
    restart(kevinCut, 'hop');
    restart(laugh, 'go');
    bubble.classList.add('show');
    cheerTimer = setTimeout(() => {
      bubble.classList.remove('show');
      kevinCut.classList.remove('hop');
      laugh.classList.remove('go');
    }, 3200);
  }

  // ===== 스탑워치 =====
  const display = document.getElementById('display');
  const startBtn = document.getElementById('startBtn');
  const lapBtn = document.getElementById('lapBtn');
  const lapList = document.getElementById('laps');

  let running = false;
  let startTime = 0;   // performance.now() 기준 시작 시각
  let elapsed = 0;     // 정지 시점까지 누적된 시간(ms)
  let lapStart = 0;    // 현재 랩이 시작된 누적 시간
  let laps = [];       // 각 랩의 소요 시간(ms)
  let rafId = null;
  let lastTen = 0;     // 마지막으로 별이 반짝인 10초 구간
  let lastMinute = 0;  // 마지막으로 케빈이 웃은 1분 구간

  function format(ms) {
    const totalCs = Math.floor(ms / 10);
    const cs = totalCs % 100;
    const s = Math.floor(totalCs / 100) % 60;
    const m = Math.floor(totalCs / 6000) % 60;
    const h = Math.floor(totalCs / 360000);
    const pad = n => String(n).padStart(2, '0');
    return (h > 0 ? h + ':' : '') + pad(m) + ':' + pad(s) + '.' + pad(cs);
  }

  function now() {
    return running ? elapsed + (performance.now() - startTime) : elapsed;
  }

  function tick() {
    const t = now();
    display.textContent = format(t);
    const current = lapList.firstElementChild;
    if (current && current.dataset.current) {
      current.lastElementChild.textContent = format(t - lapStart);
    }

    const ten = Math.floor(t / 10000);
    if (ten > lastTen) { lastTen = ten; sparkleStar(); }
    const minute = Math.floor(t / 60000);
    if (minute > lastMinute) { lastMinute = minute; kevinCheer(); }

    rafId = requestAnimationFrame(tick);
  }

  function renderLaps() {
    lapList.innerHTML = '';
    const t = now();
    if (running || elapsed > 0) {
      lapList.appendChild(makeRow(laps.length + 1, t - lapStart, true));
    }
    const min = Math.min(...laps), max = Math.max(...laps);
    for (let i = laps.length - 1; i >= 0; i--) {
      const li = makeRow(i + 1, laps[i]);
      if (laps.length >= 2) {
        if (laps[i] === min) li.classList.add('best');
        else if (laps[i] === max) li.classList.add('worst');
      }
      lapList.appendChild(li);
    }
  }

  function makeRow(n, ms, current = false) {
    const li = document.createElement('li');
    if (current) li.dataset.current = '1';
    li.innerHTML = `<span>랩 ${n}</span><span>${format(ms)}</span>`;
    return li;
  }

  function toggle() {
    if (running) {
      elapsed = now();
      running = false;
      cancelAnimationFrame(rafId);
      display.textContent = format(elapsed);
    } else {
      startTime = performance.now();
      running = true;
      tick();
    }
    startBtn.textContent = running ? '정지' : '시작';
    startBtn.classList.toggle('running', running);
    lapBtn.disabled = false;
    lapBtn.textContent = running ? '랩' : '재설정';
    renderLaps();
  }

  function lapOrReset() {
    if (running) {
      const t = now();
      laps.push(t - lapStart);
      lapStart = t;
      renderLaps();
    } else {
      reset();
    }
  }

  function reset() {
    running = false;
    cancelAnimationFrame(rafId);
    elapsed = 0;
    lapStart = 0;
    laps = [];
    lastTen = 0;
    lastMinute = 0;
    display.textContent = format(0);
    startBtn.textContent = '시작';
    startBtn.classList.remove('running');
    lapBtn.textContent = '랩';
    lapBtn.disabled = true;
    lapList.innerHTML = '';
  }

  startBtn.addEventListener('click', toggle);
  lapBtn.addEventListener('click', lapOrReset);

  document.addEventListener('keydown', e => {
    if (e.repeat) return;
    if (e.code === 'Space') { e.preventDefault(); toggle(); }
    else if (e.key.toLowerCase() === 'l' && running) lapOrReset();
    else if (e.key.toLowerCase() === 'r' && !running) reset();
  });
</script>
</body>
</html>
